<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Mac is right for you?</title>
<script>
// ─── CONFIGURATION ────────────────────────────────
// Edit values here to update general properties.
const CONFIG = {

  // ── Debug ─────────────────────────────────────
  // Set to true to show live scoring panel during the quiz
  debug: false,

  // ── UI ────────────────────────────────────────
  title:          'What Mac is right for you?',
  subtitle:       'Answer a few quick questions and we\'ll recommend the best device for your needs.',
  logoUrl:        'https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Apple_logo_white.svg/1280px-Apple_logo_white.svg.png',
  logoAlt:        'Apple',
  // CSS gradient for the header banner — supports any valid CSS gradient or solid colour
  bannerGradient: 'linear-gradient(135deg, #e8b830 0%, #4a0e7a 50%, #0a0018 100%)',

  // ── Pricing ───────────────────────────────────
  // Text appended to every price in parentheses — set to '' to omit
  appleCareSuffix: '',

};
// ──────────────────────────────────────────────────
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <img class="site-logo" src="https://www.csiro.au/-/media/Web-team/Images/CSIRO_Logo/logo.png" alt="CSIRO">
    <div class="site-header-divider"></div>
    <div class="site-header-text">
      <h1>What Mac is right for you?</h1>
      <p>Answer a few quick questions and we'll recommend the best device for your needs.</p>
    </div>
    <a class="site-header-link" href="overview.html">Compare all Macs →</a>
  </div>
</header>
<div class="page">
  <div id="debug-panel" class="debug-bar hidden"></div>

  <div id="quiz-section">
    <div class="progress-label" id="progress-label">Question 1 of 9</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="question-container"></div>
  </div>

  <div id="result-section" class="hidden"></div>
</div>

<!-- Device models, specs, and pricing — edit devices.js to update -->
<script src="devices.js"></script>
<script>
const questions = [
  {
    id: 'role',
    text: 'Which best describes your primary role?',
    hint: 'Pick the closest match to your day-to-day work',
    options: [
      { label: 'Administrative / Support', desc: 'Email, documents, scheduling, coordination', value: 'admin', signals: { everyday: 3, budgetConscious: 1 } },
      { label: 'Research / Analysis', desc: 'Data analysis, large datasets, scientific computing', value: 'research', signals: { data: 2, power: 1 } },
      { label: 'Software Development', desc: 'Writing code, building apps, DevOps', value: 'dev', signals: { development: 3, power: 1 } },
      { label: 'Creative / Communications', desc: 'Design, video, photography, content creation', value: 'creative', signals: { creative: 3, power: 1 } }
    ]
  },
  {
    id: 'apps',
    text: 'Which applications do you use most heavily?',
    hint: 'Think about what you spend the bulk of your time in',
    options: [
      { label: 'Office suite & web apps', desc: 'Outlook, Word, Excel, Teams, browser-based tools', value: 'office', signals: { everyday: 3 } },
      { label: 'Creative apps', desc: 'Photoshop, Illustrator, Figma, Final Cut, Premiere', value: 'creative', signals: { creative: 3, power: 1 } },
      { label: 'Development tools', desc: 'VS Code, Xcode, Docker, terminal, Git', value: 'dev', signals: { development: 2, power: 1 } },
      { label: 'Data & analysis tools', desc: 'Excel (large datasets), R, Python, Jupyter, MATLAB', value: 'data', signals: { data: 3, power: 1 } }
    ]
  },
  {
    id: 'multitask',
    text: 'How many applications do you typically have open at once?',
    hint: 'Think about a busy workday',
    options: [
      { label: 'Light - a few apps and tabs', desc: 'Browser, email, maybe a document', value: 'light', signals: { everyday: 3, portability: 1 } },
      { label: 'Moderate - several apps running', desc: '10-15 browser tabs, Office apps, Teams', value: 'moderate', signals: { everyday: 2 } },
      { label: 'Heavy - many apps and services', desc: '30+ tabs, multiple heavy apps, background processes', value: 'heavy', signals: { power: 3 } },
      { label: 'Extreme - VMs, containers, servers', desc: 'Docker, virtual machines, local servers, CI tools', value: 'extreme', signals: { power: 4, desktop: 2 } }
    ]
  },
  {
    id: 'video',
    text: 'Do you edit photos or video as part of your work?',
    hint: 'Not just viewing - actively editing and producing',
    options: [
      { label: 'No, not at all', desc: '', value: 'none', signals: { everyday: 2 } },
      { label: 'Occasionally - light photo editing', desc: 'Quick crops, filters, basic adjustments', value: 'light', signals: { everyday: 1, creative: 1 } },
      { label: 'Regularly - photo and some video', desc: 'Photoshop, Lightroom, short video edits', value: 'regular', signals: { creative: 3 } },
      { label: 'Daily - heavy video or 3D work', desc: 'Premiere, Final Cut, After Effects, 3D rendering', value: 'heavy', signals: { creative: 2, power: 3 } }
    ]
  },
  {
    id: 'ai',
    text: 'Do you use AI or LLM tools in your work?',
    hint: 'This includes cloud services like ChatGPT as well as running models locally on your device',
    options: [
      { label: 'No - I don\'t use AI tools', desc: 'Not part of my workflow at all', value: 'not_at_all', signals: { everyday: 2, budgetConscious: 1 } },
      { label: 'Cloud AI services only', desc: 'ChatGPT, Claude, Copilot via browser', value: 'none', signals: { everyday: 2 } },
      { label: 'Interested in running local models', desc: 'Exploring local AI but not yet required', value: 'interested', signals: { ai: 2, development: 1 } },
      { label: 'Yes - I run local models regularly', desc: 'Ollama, llama.cpp, ML training, inference', value: 'regular', signals: { ai: 4, power: 2 } }
    ]
  },
  {
    id: 'displays',
    text: 'How many external displays do you connect?',
    hint: 'At your desk setup',
    options: [
      { label: 'None - I use the laptop screen only', desc: '', value: 'none', signals: { portability: 1 } },
      { label: 'One external monitor', desc: 'Single monitor at my desk', value: 'one', signals: {} },
      { label: 'Two or more monitors', desc: 'Dual display or ultrawide setup', value: 'multi', signals: { multiDisplay: 3 } }
    ]
  },
  {
    id: 'portability',
    text: 'How important is portability to you?',
    hint: 'How often are you away from your desk?',
    options: [
      { label: 'Essential - I work on the go daily', desc: 'Meetings, travel, flexible work locations', value: 'essential', signals: { portability: 4 } },
      { label: 'Nice to have - mostly at my desk', desc: 'Occasionally take it to meetings', value: 'nice', signals: { portability: 2 } },
      { label: 'Not important - always at my desk', desc: 'Dedicated workstation setup', value: 'none', signals: { desktop: 4 } }
    ]
  },
  {
    id: 'screensize',
    text: 'Do you have a preference for laptop screen size?',
    hint: 'Neo is 13" only. Air is 13.6" or 15.3". Pro is 14" or 16".',
    options: [
      { label: 'No preference — compact is fine', desc: '13" works well for me, especially with an external monitor', value: 'compact', signals: { portability: 1 } },
      { label: 'Prefer a larger screen — around 14-15"', desc: 'I work a lot directly on the laptop display', value: 'medium', signals: { largeScreen: 2 } },
      { label: 'Biggest available — 15-16"', desc: 'Screen real estate is important to how I work', value: 'large', signals: { largeScreen: 4 } }
    ]
  },
  {
    id: 'budget',
    text: 'What is the budget priority for this device?',
    hint: 'This helps balance capability against cost',
    options: [
      { label: 'Keep costs low', desc: 'Most affordable option that meets my needs', value: 'low', signals: { budgetConscious: 4, everyday: 1 } },
      { label: 'Balanced - value for money', desc: 'Happy to invest more for meaningful capability gains', value: 'mid', signals: { everyday: 1 } },
      { label: 'Performance first', desc: 'Get the right tool regardless of cost', value: 'high', signals: { power: 2 } }
    ]
  }
];

let currentQ = 0;
let answers = {};

function injectDeviceStyles() {
  const rules = Object.values(devices).map(d => `
    .result-hero[data-device="${d.id}"]::before { background: ${d.color}; }
    .result-icon[data-device="${d.id}"] { background: ${d.colorBg}; }
    .result-label[data-device="${d.id}"] { color: ${d.color}; }
    .score-graph-label[data-device="${d.id}"] { color: ${d.color}; }
    .score-graph-bar-fill[data-device="${d.id}"] { background: ${d.color}; }
    .debug-device-name[data-device="${d.id}"] { color: ${d.colorDark}; }
    .debug-final-bar[data-device="${d.id}"] { background: ${d.colorDark}; }
  `).join('');
  const s = document.createElement('style');
  s.textContent = rules;
  document.head.appendChild(s);
}

function score() {
  const deviceKeys = Object.keys(devices);
  const s = Object.fromEntries(deviceKeys.map(k => [k, 0]));
  for (const q of questions) {
    const answer = answers[q.id];
    if (!answer) continue;
    const opt = q.options.find(o => o.value === answer);
    if (!opt || !opt.signals) continue;
    for (const [dim, strength] of Object.entries(opt.signals)) {
      for (const dk of deviceKeys) {
        s[dk] += strength * (devices[dk].weights[dim] || 0);
      }
    }
  }
  let best = deviceKeys[0];
  for (const dk of deviceKeys) { if (s[dk] > s[best]) best = dk; }
  return { scores: s, best };
}

function render() {
  const q = questions[currentQ];
  const total = questions.length;
  document.getElementById('progress-label').textContent = `Question ${currentQ + 1} of ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentQ) / total) * 100}%`;

  const selected = answers[q.id] || null;

  let html = `<div class="question-card" key="${q.id}">
    <div class="question-number">Q${currentQ + 1}</div>
    <div class="question-text">${q.text}</div>
    <div class="question-hint">${q.hint}</div>
    <div class="options">`;

  q.options.forEach(opt => {
    const sel = selected === opt.value ? ' selected' : '';
    html += `<div class="option${sel}" onclick="selectOption('${q.id}','${opt.value}')">
      <div class="option-radio"></div>
      <div><div class="option-label">${opt.label}</div>${opt.desc ? `<div class="option-desc">${opt.desc}</div>` : ''}</div>
    </div>`;
  });

  html += `</div>
    <div class="nav">
      <button class="btn btn-secondary" onclick="prev()" ${currentQ === 0 ? 'style="visibility:hidden"' : ''}>← Back</button>
      <button class="btn btn-primary" id="next-btn" onclick="next()" ${!selected ? 'disabled' : ''}>${currentQ === total - 1 ? 'See my result' : 'Continue →'}</button>
    </div>
  </div>`;

  document.getElementById('question-container').innerHTML = html;
  if (CONFIG.debug) renderDebug();
}

function renderDebug() {
  const panel = document.getElementById('debug-panel');
  panel.classList.remove('hidden');

  const s = score().scores;
  const best = Object.entries(s).sort((a, b) => b[1] - a[1])[0][0];

  const answeredQs = questions.filter(q => answers[q.id]);
  const answerSummary = answeredQs.map(q => {
    const opt = q.options.find(o => o.value === answers[q.id]);
    return `<span>${q.id}</span>: ${opt ? opt.label : answers[q.id]}`;
  }).join(' · ');

  panel.innerHTML = `
    <div class="debug-title">⚙ Debug - live scoring (${answeredQs.length}/${questions.length} answered)</div>
    <div class="debug-scores">
      ${Object.entries(s).map(([k, v]) => `
        <div class="debug-device${k === best && v > 0 ? ' leading' : ''}">
          <div class="debug-device-name" data-device="${k}">${devices[k].shortName}</div>
          <div class="debug-device-score">${Math.round(v * 10) / 10}</div>
        </div>
      `).join('')}
    </div>
    ${answerSummary ? `<div class="debug-answers">${answerSummary}</div>` : ''}
  `;
}

function selectOption(qid, val) {
  answers[qid] = val;
  render();
}

function prev() {
  if (currentQ > 0) { currentQ--; render(); }
}

function next() {
  if (!answers[questions[currentQ].id]) return;
  if (currentQ < questions.length - 1) {
    currentQ++;
    render();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-section').classList.add('hidden');
  document.querySelector('.page').classList.add('wide');
  const { scores, best } = score();
  const d = devices[best];

  const priceStr = CONFIG.appleCareSuffix
    ? `From ${d.price} (${CONFIG.appleCareSuffix})`
    : `From ${d.price}`;

  // Sort matrix: yes first, then limited, then no
  const statusOrder = { yes: 0, limited: 1, no: 2 };
  const sortedMatrix = [...d.matrix].sort((a, b) => statusOrder[a[1]] - statusOrder[b[1]]);

  let matrixHtml = sortedMatrix.map(([task, status]) =>
    `<div class="matrix-row"><span class="matrix-task">${task}</span><span class="matrix-badge ${status}">${status === 'yes' ? 'YES' : status === 'limited' ? 'LIMITED' : 'NO'}</span></div>`
  ).join('');

  let prosHtml = d.pros.map(p => `<li><span class="icon pro">✓</span>${p}</li>`).join('');
  let consHtml = d.cons.map(c => `<li><span class="icon con">✗</span>${c}</li>`).join('');
  let tagsHtml = d.useCases.map(u => `<span class="use-tag">${u}</span>`).join('');

  let specsHtml = '';
  const specLabels = { chip: 'Chip', cores: 'CPU/GPU', memory: 'Memory', storage: 'Storage', battery: 'Battery', display: 'Display', ports: 'Ports', wireless: 'Wireless' };
  for (const [k, v] of Object.entries(d.specs)) {
    specsHtml += `<div class="spec-item"><div class="spec-label">${specLabels[k]}</div><div class="spec-value">${v}</div></div>`;
  }

  // Runner up
  let sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  let runnerUp = sorted[1];
  let ruDevice = devices[runnerUp[0]];
  const ruPriceStr = CONFIG.appleCareSuffix
    ? `From ${ruDevice.price} (${CONFIG.appleCareSuffix})`
    : `From ${ruDevice.price}`;

  document.getElementById('result-section').innerHTML = `
    <div class="result-container">
      <div class="result-card">
        <div class="result-hero" data-device="${d.id}">
          <div class="result-icon" data-device="${d.id}">${d.icon}</div>
          <div class="result-label" data-device="${d.id}">Our recommendation</div>
          <div class="result-device">${d.name}</div>
          <div class="result-tagline">${d.tagline}</div>
          <div style="margin-top:8px;font-size:14px;font-weight:600;color:var(--text-secondary)">${priceStr}${d.shopUrl ? ` · <a href="${d.shopUrl}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600">Shop ↗</a>` : ''}</div>
        </div>
        <div class="result-body">
          <div class="result-columns">
            <div class="result-col-left">
              <div class="result-section-title">Key specifications</div>
              <div class="spec-grid">${specsHtml}</div>

              <div class="result-section-title">Recommended for</div>
              <div class="use-cases">${tagsHtml}</div>

              <div class="result-section-title">Pros & cons</div>
              <div class="pro-con-grid">
                <div><div class="pro-con-label pros">Pros</div><ul class="pro-con-list">${prosHtml}</ul></div>
                <div><div class="pro-con-label cons">Cons</div><ul class="pro-con-list">${consHtml}</ul></div>
              </div>

              <div style="margin-top:20px;padding:14px 16px;background:var(--surface-alt);border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary)">
                <strong style="color:var(--text)">Also consider:</strong> ${ruDevice.name} - ${ruDevice.tagline.toLowerCase()} (${ruPriceStr})
              </div>
            </div>
            <div class="result-col-right">
              <div class="result-section-title">Performance matrix</div>
              ${matrixHtml}

              ${buildScoreGraph(scores, best)}

              <div class="note-box">
                <strong>Note:</strong> ${d.notes}
              </div>

              ${CONFIG.debug ? buildDebugFinal(scores, best) : ''}
            </div>
          </div>
          ${buildUpgradeOptions(best)}
        </div>
      </div>
      <div style="text-align:center">
        <button class="btn btn-restart" onclick="restart()">↻ Start over</button>
      </div>
    </div>`;

  if (CONFIG.debug) document.getElementById('debug-panel').classList.add('hidden');
  document.getElementById('result-section').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildScoreGraph(scores, best) {
  const total = Object.values(scores).reduce((a, b) => a + b, 0) || 1;
  const maxS = Math.max(...Object.values(scores), 1);
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topScore = sorted[0][1];
  const runnerScore = sorted[1][1];
  const isClose = topScore > 0 && runnerScore > 0 && (topScore - runnerScore) <= 3;

  return `
    <div class="score-graph">
      <div class="score-graph-title">How you matched</div>
      ${sorted.map(([k, v]) => {
        const positiveTotal = Object.values(scores).filter(x => x > 0).reduce((a, b) => a + b, 0) || 1;
        const pct = v > 0 ? Math.round((v / positiveTotal) * 100) : 0;
        const barW = Math.max(0, maxS > 0 ? (v / maxS) * 100 : 0);
        return `<div class="score-graph-row">
          <div class="score-graph-label" data-device="${k}">${devices[k].shortName}</div>
          <div class="score-graph-bar-track">
            <div class="score-graph-bar-fill" data-device="${k}" style="width:${barW}%"></div>
          </div>
          <div class="score-graph-pct">${pct}%</div>
        </div>`;
      }).join('')}
      ${isClose ? `<div class="score-graph-hint">Your top two results were close - you may want to compare both options with your manager or IT before deciding.</div>` : ''}
    </div>`;
}

function buildDebugFinal(scores, best) {
  const maxS = Math.max(...Object.values(scores), 1);
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);

  const answerSummary = questions.map(q => {
    const opt = q.options.find(o => o.value === answers[q.id]);
    return `<span style="color:#e7e5e4">${q.id}</span>: ${opt ? opt.label : '-'}`;
  }).join('<br>');

  return `
    <div class="debug-final">
      <div class="debug-title">⚙ Debug - final scores</div>
      ${sorted.map(([k, v]) => `
        <div class="debug-final-row">
          <div class="debug-final-label" data-device="${k}">${devices[k].shortName}</div>
          <div class="debug-final-bar-bg">
            <div class="debug-final-bar" data-device="${k}" style="width:${Math.max(0, (v / maxS) * 100)}%"></div>
          </div>
          <div class="debug-final-val">${Math.round(v * 10) / 10}</div>
        </div>
      `).join('')}
      <div class="debug-final-winner">
        Winner: <strong>${devices[best].name}</strong> (score ${Math.round(scores[best] * 10) / 10})
        · Runner-up: ${devices[sorted[1][0]].name} (${Math.round(sorted[1][1] * 10) / 10})
        · Gap: ${Math.round((scores[best] - sorted[1][1]) * 10) / 10} pts
      </div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);font-size:10px;color:#a8a29e;line-height:1.8">
        ${answerSummary}
      </div>
    </div>`;
}

function buildUpgradeOptions(deviceKey) {
  const d = devices[deviceKey];
  if (!d.upgradeOptions) return '';

  const sectionLabels = { display: 'Display Size', cpu: 'CPU / Chip', ram: 'Memory (RAM)', storage: 'Storage' };

  const sectionsHtml = Object.entries(d.upgradeOptions).map(([key, options]) => `
    <div>
      <div class="upgrade-category-label">${sectionLabels[key]}</div>
      <div class="upgrade-options">
        ${options.map((opt, i) => `
          <div class="upgrade-option${i === 0 ? ' base' : ''}">
            <div class="upgrade-option-label">${opt.label}</div>
            ${opt.note ? `<div class="upgrade-option-note">${opt.note}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  return `
    <div class="upgrade-section">
      <div class="result-section-title">Configuration options</div>
      <div class="upgrade-grid">${sectionsHtml}</div>
      ${d.upgradeNote ? `<div class="upgrade-overlap-note">${d.upgradeNote}</div>` : ''}
    </div>
  `;
}

function restart() {
  currentQ = 0;
  answers = {};
  document.querySelector('.page').classList.remove('wide');
  document.getElementById('result-section').classList.add('hidden');
  document.getElementById('result-section').innerHTML = '';
  document.getElementById('quiz-section').classList.remove('hidden');
  if (CONFIG.debug) document.getElementById('debug-panel').classList.remove('hidden');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

injectDeviceStyles();
(function applyConfig() {
  document.title = CONFIG.title;
  const logo = document.querySelector('.site-logo');
  if (logo) { logo.src = CONFIG.logoUrl; logo.alt = CONFIG.logoAlt; }
  const header = document.querySelector('.site-header');
  if (header) header.style.background = CONFIG.bannerGradient;
  const h1 = document.querySelector('.site-header-text h1');
  if (h1) h1.textContent = CONFIG.title;
  const sub = document.querySelector('.site-header-text p');
  if (sub) sub.textContent = CONFIG.subtitle;
})();
render();
</script>
</body>
</html>
